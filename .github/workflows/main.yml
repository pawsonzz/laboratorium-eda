name: testy
on: [push, pull_request]
jobs:
  notatnik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jupyter nbconvert pandas numpy matplotlib "scikit-learn>=1.4"
      - run: jupyter nbconvert --to notebook --execute lab3_student_rozwiazane.ipynb --output test_run.ipynb --ExecutePreprocessor.timeout=600
